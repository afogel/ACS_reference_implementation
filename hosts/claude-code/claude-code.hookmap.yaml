# S1 -- the ONLY per-host artifact besides the hook shim (N1, Task 9).
#
# Pure data: maps Claude Code's own hook names and payload shape onto ACS
# methods/arguments (the `hooks` block, read by buildEnvelope / N2), and
# maps ACS decisions onto Claude Code's `hookSpecificOutput` shape (the
# `decisions` block, read by renderDecision / N3, Task 8).
#
# `tool_name` and `arguments` are JSONPath-lite references (`$.<field>`)
# into the raw hook payload Claude Code delivers on stdin for this event --
# see the real PreToolUse payload shape in the Task 7 brief.
host: claude-code
hooks:
  PreToolUse:
    acs_method: steps/toolCallRequest
    tool_name: $.tool_name
    arguments: $.tool_input
# Fix wave finding 5: Claude Code's PreToolUse hookSpecificOutput only
# accepts permissionDecision "allow" | "deny" | "ask" (see Claude Code's own
# hook docs) -- there is no "defer" value on the wire, so `defer:
# { permissionDecision: defer }` was never a legal Claude Code output. It
# was unreachable in V1 (no verdict in mapping.yaml produces an ACS
# "defer" decision today) but would have broken the moment one did.
# ACS's own defer-details.json defaults an unresolved defer's
# `timeout_decision` to "deny", so `deny` is the spec-consistent fail-closed
# choice for a host (like Claude Code) with no native defer/pending state --
# NOT a considered posture, just the least-wrong mapping until a host that
# can actually represent deferral exists. V3, which owns posture and
# disposition decisions (N27, N6/N7), should treat this as a known gap
# rather than rediscovering it.
decisions:
  allow:  { permissionDecision: allow }
  deny:   { permissionDecision: deny, reason_from: reasoning }
  ask:    { permissionDecision: ask, reason_from: reasoning }
  defer:  { permissionDecision: deny, reason_from: reasoning }
  modify: { permissionDecision: allow, updatedInput_from: modifications }
