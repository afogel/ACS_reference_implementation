# The fact vocabulary (S7, E6): every relation a predicate may mention, with
# its columns, their types, and where its tuples come from. Predicates are
# written over these names and nothing else (R3.2); a predicate naming a
# relation not declared here fails to compile.
#
# source:
#   wire           derived from the envelope log by `acs-ir verify` (N41)
#   external       computed by ordinary code, not Datalog: hashes, JCS,
#                  signatures, schema validation (E7.1, N42/N43 in V6)
#   guardian-state the Guardian's own records: its decision log, session
#                  context, intent snapshots; supplied as facts by a Guardian
#                  that opts in to being verified
#   deployment     configuration the verifier is told, not shown
#   static         fixed by the spec; the tuples are listed here and shipped
#                  inside the compiled program
#
# Types are `symbol` (a string) and `number` (an integer), Soufflé's two
# scalar kinds the evaluator also distinguishes. Every column also has a
# domain, which names what it holds: `seq`, `session`, `pid`, `field`. The
# domain defaults to the column name; a column holding the same kind of
# value under another name declares it (`request_seq` is a `seq`, `parent`
# is a `pid`). A rule that joins or compares two different domains does
# not compile, and the published Soufflé program declares each domain as
# a subtype so Soufflé refuses it too.
relations:
  # --- the wire ---
  - name: envelope
    source: wire
    columns: [{ name: seq, type: number }, { name: session, type: symbol }, { name: direction, type: symbol }, { name: method, type: symbol }, { name: rpc_id, type: symbol }]
    doc: "One tuple per envelope-log line. `direction` is request or response; `method` is the ACS method the Guardian dispatched."
  - name: request
    source: wire
    columns: [{ name: seq, type: number }, { name: session, type: symbol }, { name: method, type: symbol }, { name: request_id, type: symbol }, { name: timestamp, type: symbol }]
  - name: response_to
    source: wire
    columns: [{ name: request_seq, type: number, domain: seq }, { name: response_seq, type: number, domain: seq }]
    doc: "Pairs a response with its request by JSON-RPC id."
  - name: decision
    source: wire
    columns: [{ name: seq, type: number }, { name: disposition, type: symbol }]
    doc: "A response's `result.decision`, lowercase."
  - name: result_field
    source: wire
    columns: [{ name: seq, type: number }, { name: field, type: symbol }]
    doc: "A top-level field present in a response's result."
  - name: error_code
    source: wire
    columns: [{ name: seq, type: number }, { name: code, type: number, domain: error_code }]
  - name: array_input
    source: wire
    columns: [{ name: seq, type: number }]
    doc: "The request line was a JSON array (a batch)."
  - name: handshake
    source: wire
    columns: [{ name: seq, type: number }, { name: session, type: symbol }]
    doc: "A `handshake/hello` request."
  - name: hook
    source: wire
    columns: [{ name: seq, type: number }, { name: session, type: symbol }, { name: method, type: symbol }]
    doc: "A `steps/*` request."
  - name: defer_field
    source: wire
    columns: [{ name: seq, type: number }, { name: field, type: symbol }]
    doc: "A field present in a DEFER response's `defer_details`."
  - name: defer_reason
    source: wire
    columns: [{ name: seq, type: number }, { name: reason, type: symbol }]
  - name: provenance
    source: wire
    columns: [{ name: seq, type: number }, { name: session, type: symbol }, { name: pid, type: symbol }, { name: origin, type: symbol }]
    doc: "A Provenance object carried by a hook payload."
  - name: provenance_fingerprint
    source: wire
    columns: [{ name: session, type: symbol }, { name: pid, type: symbol }, { name: fingerprint, type: symbol }]
    doc: "Hash of a Provenance object's own fields, so two different objects sharing a `provenance_id` are visible."
  - name: derived_from
    source: wire
    columns: [{ name: seq, type: number }, { name: pid, type: symbol }, { name: parent, type: symbol, domain: pid }]
  - name: trust
    source: wire
    columns: [{ name: seq, type: number }, { name: pid, type: symbol }, { name: level, type: symbol }]
    doc: "The OPTIONAL `trust` label, when a deployment populates it."
  - name: chain_hash_published
    source: wire
    columns: [{ name: seq, type: number }, { name: hash, type: symbol, domain: chain_hash }]
    doc: "A response carrying `chain_hash`."
  - name: client_version
    source: wire
    columns: [{ name: session, type: symbol }, { name: version, type: symbol }]
    doc: "An entry of ClientHello's `acs_versions_supported`."
  - name: chain_mismatch_observed
    source: wire
    columns: [{ name: session, type: symbol }, { name: seq, type: number }]
    doc: "The Observed Agent's cross-check `metadata.session_state.chain_hash` disagreed with the head the Guardian last published for the session."
  # --- computed by ordinary code (E7.1) ---
  - name: entry_hash_recomputed
    source: external
    columns: [{ name: entry_id, type: symbol }, { name: hash, type: symbol, domain: entry_hash }]
    doc: "SHA-256 over JCS per \u00a78.2, recomputed from the entry's fields by the verifier."
  - name: signature_covers
    source: external
    columns: [{ name: seq, type: number }, { name: field, type: symbol }]
    doc: "The envelope's signature verified over the \u00a710 canonical input, and that input contained `field`."
  - name: signature_status
    source: external
    columns: [{ name: seq, type: number }, { name: status, type: symbol }]
    doc: "valid, invalid, or absent, from recomputing the \u00a710 canonical form."
  - name: schema_violation
    source: external
    columns: [{ name: seq, type: number }, { name: schema, type: symbol }, { name: path, type: symbol, domain: json_path }]
    doc: "An envelope that failed validation against a pinned schema, with the JSON path of the failure."
  # --- the Guardian's own records ---
  - name: evaluator_ran
    source: guardian-state
    columns: [{ name: seq, type: number }, { name: layer, type: symbol }, { name: order, type: number }]
    doc: "Which evaluation layer ran for a decision and in what order (agents.md decision logging)."
  - name: context_entry
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: entry_id, type: symbol }, { name: seq, type: number }, { name: entry_hash, type: symbol }]
  - name: intent_parsed
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: seq, type: number }, { name: capability, type: symbol }]
    doc: "A snapshot of `Intent.parsed` as of a step."
  - name: intent_established
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: seq, type: number }]
  - name: intent_extension
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: seq, type: number }, { name: capability, type: symbol }]
    doc: "A capability an Approver's `intent_extension` with `scope: session` appended."
  - name: intent_modification_rejected
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: seq, type: number }]
  - name: audit_event
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: seq, type: number }, { name: kind, type: symbol }]
  - name: archived
    source: guardian-state
    columns: [{ name: session, type: symbol }]
    doc: "The Guardian exercised \u00a78.5 archival in this session."
  - name: archive_preserved
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: field, type: symbol }]
  - name: approver_verified
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: approver, type: symbol }]
  - name: ask_resolved
    source: guardian-state
    columns: [{ name: seq, type: number }, { name: session, type: symbol }, { name: approver, type: symbol }]
    doc: "The Guardian's record that an Approver, by `ask_details.approver.id`, returned the decision at `seq`. Guardian-to-Approver traffic is not in the Observed Agent's log."
  # --- told to the verifier ---
  - name: session_batching
    source: deployment
    columns: [{ name: session, type: symbol }, { name: support, type: symbol }]
    doc: "supported or unsupported; whether the Guardian accepts JSON-RPC batches."
  - name: defer_bound
    source: deployment
    columns: [{ name: session, type: symbol }, { name: bound, type: number }]
    doc: "The deployment's cascading-deferral limit (\u00a76)."
  - name: guardian_version
    source: deployment
    columns: [{ name: version, type: symbol }]
    doc: "An `acs_version` the Guardian supports."
  # --- fixed by the spec ---
  - name: required_field
    source: static
    columns: [{ name: disposition, type: symbol }, { name: field, type: symbol }]
    doc: "The \u00a76 table's Required fields column (ACS-REQ-0003)."
    facts:
      - [deny, reasoning]
      - [modify, reasoning]
      - [modify, modifications]
      - [ask, reasoning]
      - [ask, ask_details]
      - [defer, reasoning]
      - [defer, defer_details]
  - name: defer_required
    source: static
    columns: [{ name: field, type: symbol }]
    doc: "The fields \u00a76 says DEFER MUST include (ACS-REQ-0004)."
    facts: [[resolution_method], [resolution_timeout_ms], [timeout_decision]]
  - name: defer_reason_allowed
    source: static
    columns: [{ name: reason, type: symbol }]
    facts: [[insufficient_context], [conflicting_policies], [low_confidence], [pending_dependency]]
  - name: trust_rank
    source: static
    columns: [{ name: level, type: symbol }, { name: rank, type: number }]
    doc: "Ordering for the monotonicity rule (ACS-REQ-0010)."
    facts: [[untrusted, 0], [unknown, 1], [trusted, 2]]
  - name: default_trust
    source: static
    columns: [{ name: origin, type: symbol }, { name: level, type: symbol }]
    doc: "\u00a77.2's default trust per origin channel (ACS-REQ-0027). agent_generated is absent: its default is the lineage minimum, ACS-REQ-0010."
    facts:
      - [user_input, trusted]
      - [system, trusted]
      - [tool_output, untrusted]
      - [retrieved, untrusted]
      - [a2a_inbound, untrusted]
      - [external, untrusted]
  - name: content_bearing_method
    source: static
    columns: [{ name: method, type: symbol }]
    doc: "The steps for which the Guardian writes a ContextEntry (\u00a78.6). Editorial reading; the spec names the set by description, not by list."
    facts:
      - [steps/agentTrigger]
      - [steps/userMessage]
      - [steps/toolCallRequest]
      - [steps/toolCallResult]
      - [steps/agentResponse]
      - [steps/knowledgeRetrieval]
      - [steps/memoryContextRetrieval]
      - [steps/memoryStore]
      - [steps/postCompact]
  - name: archive_required_field
    source: static
    columns: [{ name: field, type: symbol }]
    facts: [[chain_hash], [provenance_summary], [intent]]
  # --- V7 additions: what the other 128 provisions needed ---
  - name: client_provenance_producer
    source: wire
    columns: [{ name: session, type: symbol }, { name: mode, type: symbol, domain: producer_mode }]
    doc: "ClientHello's `provenance_producer`: deterministic or none."
  - name: modification_field
    source: wire
    columns: [{ name: seq, type: number }, { name: field, type: symbol }]
    doc: "A key present in a MODIFY response's `modifications`."
  - name: intent_parser_origin
    source: wire
    columns: [{ name: seq, type: number }, { name: origin, type: symbol }]
    doc: "`intent.parser_provenance.origin` on a sessionStart or agentTrigger payload."
  - name: intent_scope_mode
    source: wire
    columns: [{ name: session, type: symbol }, { name: mode, type: symbol, domain: scope_mode }]
  - name: defer_timeout_decision
    source: wire
    columns: [{ name: seq, type: number }, { name: value, type: symbol, domain: disposition }]
  - name: reason_code
    source: wire
    columns: [{ name: seq, type: number }, { name: code, type: symbol, domain: reason_code }]
    doc: "An entry of a response's `reason_codes`."
  - name: signature_algorithm
    source: wire
    columns: [{ name: seq, type: number }, { name: algorithm, type: symbol }]
    doc: "The `algorithm` of the envelope's signature, when one is present."
  - name: skew_window
    source: wire
    columns: [{ name: session, type: symbol }, { name: ms, type: number }]
    doc: "ServerHello's `skew_window_ms`."
  - name: request_nonce
    source: wire
    columns: [{ name: seq, type: number }, { name: nonce, type: symbol }]
  - name: error_data
    source: wire
    columns: [{ name: seq, type: number }]
    doc: "An error response carried a `data` object."
  - name: error_data_field
    source: wire
    columns: [{ name: seq, type: number }, { name: field, type: symbol }]
  - name: compaction_entry
    source: wire
    columns: [{ name: seq, type: number }, { name: step_id, type: symbol }]
    doc: "A step_id in a postCompact payload's `entries_compacted`."
  - name: compaction_summary_provenance
    source: wire
    columns: [{ name: seq, type: number }, { name: pid, type: symbol }]
    doc: "The `provenance_id` of a postCompact payload's summary provenance."
  - name: skill_register
    source: wire
    columns: [{ name: seq, type: number }, { name: session, type: symbol }, { name: skill_id, type: symbol }, { name: digest, type: symbol }]
    doc: "A skillRegister request: the skill and its definition digest value."
  - name: skill_load
    source: wire
    columns: [{ name: seq, type: number }, { name: session, type: symbol }, { name: skill_id, type: symbol }, { name: digest, type: symbol }]
  - name: agbom_component
    source: wire
    columns: [{ name: seq, type: number }, { name: session, type: symbol }, { name: type, type: symbol, domain: component_type }, { name: id, type: symbol, domain: component_id }]
    doc: "A component of an agbom/snapshot or agbom/changed payload."
  - name: agbom_component_field
    source: wire
    columns: [{ name: seq, type: number }, { name: id, type: symbol, domain: component_id }, { name: field, type: symbol }]
  - name: signature_algorithm_supported
    source: wire
    columns: [{ name: session, type: symbol }, { name: algorithm, type: symbol }]
    doc: "An entry of ServerHello's `signature_algorithms_supported`."
  - name: modification_targets_overlap
    source: external
    columns: [{ name: seq, type: number }, { name: redaction_path, type: symbol, domain: json_path }, { name: override_path, type: symbol, domain: json_path }]
    doc: "A redaction path and a parameter-override target that are equal or ancestor/descendant (§6.3); JSON Pointer comparison is ordinary code."
  - name: timestamp_out_of_window
    source: external
    columns: [{ name: seq, type: number }]
    doc: "The request's `timestamp` is more than the negotiated skew window (default 300000 ms) from the time the Guardian recorded it."
  - name: context_entry_field
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: entry_id, type: symbol }, { name: field, type: symbol }]
    doc: "A field present and non-null on an exported ContextEntry."
  - name: context_entry_step
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: entry_id, type: symbol }, { name: step_type, type: symbol }]
  - name: decision_log_field
    source: guardian-state
    columns: [{ name: seq, type: number }, { name: field, type: symbol }]
    doc: "A field the Guardian's decision log recorded for the decision at seq: reasoning, model_identifier, confidence."
  - name: step_provenance
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: step_id, type: symbol }, { name: pid, type: symbol }]
    doc: "The provenance_id of the Provenance object the step with this step_id carried. The wire ties a Provenance object to a seq, never to a step_id, and postCompact's entries_compacted lists step_ids, so the compaction union check (ACS-REQ-0111) needs this from the Guardian's records."
  - name: intent_derivation_recorded
    source: guardian-state
    columns: [{ name: session, type: symbol }, { name: seq, type: number }, { name: derivation, type: symbol }]
    doc: "The audit chain's record of how a spawned subagent's Intent.parsed relates to the parent's."
  - name: policy_requires_provenance
    source: deployment
    columns: [{ name: session, type: symbol }]
    doc: "The Guardian's policy requires provenance for this session (ServerHello's `policy_requires_provenance`, which a refused session never carries)."
  - name: strict_mode_forbidden
    source: deployment
    columns: [{ name: session, type: symbol }, { name: capability, type: symbol }]
    doc: "A capability the deployment policy forbids under scope_mode: strict."
  - name: client_ask_capable
    source: deployment
    columns: [{ name: session, type: symbol }, { name: capable, type: symbol }]
    doc: "yes or no: whether the Guardian determined the client can resolve ASK (§9.2, an out-of-band determination)."
  - name: agent_step_outcome
    source: deployment
    columns: [{ name: session, type: symbol }, { name: seq, type: number }, { name: outcome, type: symbol }]
    doc: "The Observed Agent's own record of what it did with a step: applied, proceeded, or blocked."
  - name: agent_audit_event
    source: deployment
    columns: [{ name: session, type: symbol }, { name: seq, type: number }, { name: kind, type: symbol }]
    doc: "An entry in the deployment's own audit log (§4.1, §6.4), keyed to the step it concerns."
  - name: strict_provenance_schema
    source: static
    columns: [{ name: schema, type: symbol }]
    doc: "The six strict hook schemas ACS-Provenance validates against."
    facts:
      - [hooks/agent-response.acs-provenance.json]
      - [hooks/knowledge-retrieval.acs-provenance.json]
      - [hooks/memory-context-retrieval.acs-provenance.json]
      - [hooks/memory-store.acs-provenance.json]
      - [hooks/tool-call-request.acs-provenance.json]
      - [hooks/tool-call-result.acs-provenance.json]
      - [hooks/user-message.acs-provenance.json]
  - name: registered_algorithm
    source: static
    columns: [{ name: algorithm, type: symbol }]
    doc: "The §10.1 registry."
    facts: [[HMAC-SHA256], [ECDSA-P256], [RSA-PSS-SHA256], [ML-DSA-65], [ML-DSA-44], [ML-DSA-87], [SLH-DSA-128s], [SLH-DSA-128f], [ML-DSA-65+ECDSA-P256], [ML-DSA-65+RSA-PSS-SHA256]]
  - name: entry_should_field
    source: static
    columns: [{ name: field, type: symbol }]
    doc: "§8.1's SHOULD fields on a ContextEntry."
    facts: [[request_hash], [timestamp], [provenance_summary]]
  - name: audit_entry_field
    source: static
    columns: [{ name: field, type: symbol }]
    doc: "The fields ACS-Audit deployments SHOULD also populate."
    facts: [[timestamp], [provenance_summary]]
  - name: decision_log_required
    source: static
    columns: [{ name: field, type: symbol }]
    doc: "What a decision log entry carries unconditionally (confidence is 'when available')."
    facts: [[reasoning], [model_identifier]]
