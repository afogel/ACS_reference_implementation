normative_tags:
  - source: concepts/README.md
    line: 11
    kind: citation
    title: ""
    text: "- **Cross-cutting invariants** (true across pillars) are defined here and tagged **(normative)**. They belong above the pillars because that is where they are true. *e.g. \"`Intent.parsed` MUST NOT be modified by the LLM or by data crossing an untrusted channel.\"*"
  - source: concepts/README.md
    line: 31
    kind: citation
    title: ""
    text: Every page carries the canonical definition, any cross-cutting invariants tagged **(normative)**, and a **Referenced by** footer pointing into the pillars that consume the concept. The graph is navigable in both directions.
  - source: concepts/agents.md
    line: 15
    kind: callout
    title: Decision logging
    text: "**Decision logging (normative).** A Guardian MUST log every decision with its reasoning, the evaluator's model identifier, and confidence when available."
  - source: concepts/agents.md
    line: 21
    kind: callout
    title: Approver authentication
    text: "**Approver authentication (normative).** Approver authentication is REQUIRED. The Guardian MUST verify the Approver's identity against policy before honoring the returned decision."
  - source: concepts/identity.md
    line: 21
    kind: callout
    title: No mandated mechanism
    text: "**No mandated mechanism (normative).** ACS mandates no authentication mechanism. The mechanism in use is declared at handshake. Trust schemes (for example SPIFFE, OIDC, DID, organizational PKI, or quorum signing) are deployment-defined and stay off the core wire contract."
  - source: concepts/intent.md
    line: 13
    kind: callout
    title: Intent immutability
    text: "**Intent immutability (normative).** Once an Intent is established, `Intent.parsed` MUST NOT be modified by the runtime LLM, by tool outputs, or by any data crossing an untrusted channel. It may grow only through approver action via the ASK flow."
  - source: concepts/intent.md
    line: 21
    kind: callout
    title: The only conformant path to widen Intent
    text: "**The only conformant path to widen Intent (normative).** The sole mechanism for extending `Intent.parsed` within a session is an Approver's `intent_extension` returned via the ASK flow. Extensions are subject to the session's `scope_mode`; under `scope_mode: strict` a Guardian MUST NOT honor an extension that adds capabilities the deployment policy forbids in strict mode."
  - source: concepts/provenance.md
    line: 19
    kind: callout
    title: Lineage spans derivation
    text: "**Lineage spans derivation (normative).** When data is derived from other data, its `derived_from` lineage is the union of the lineage of its inputs. Summarization and compaction are derivations: the summary that comes out carries the combined lineage of everything that went in."
  - source: concepts/provenance.md
    line: 27
    kind: callout
    title: Provenance is framework-assigned
    text: "**Provenance is framework-assigned (normative).** The framework, not the LLM, assigns `origin`, `source_id`, and `derived_from`, based on the code path a value came through. These fields are never inferred by the model, never a content judgment, and never a producer claim."
  - source: concepts/session-lifecycle.md
    line: 23
    kind: callout
    title: Intent derivation is auditable
    text: "**Intent derivation is auditable (normative).** When a subagent is spawned, the audit chain MUST record how the subagent's `Intent.parsed` relates to the parent's: inherited in full, a strict subset, derived from a parent directive, or fresh. A Guardian MAY deny a spawn whose derivation would grant capabilities the parent's [Intent](./intent.md) does not authorize."
  - source: concepts/trust.md
    line: 25
    kind: callout
    title: The rungs do not collapse
    text: "**The rungs do not collapse (normative).** A Guardian MUST NOT treat an asserted fact as attested. The basis of a fact is part of the fact; relying on a fact above its actual basis is an error."
  - source: concepts/trust.md
    line: 27
    kind: callout
    title: Deterministic attachment is not a producer claim
    text: "**Deterministic attachment is not a producer claim (normative).** Where ACS specifies a deterministically attached fact (a Provenance record's `origin` is the canonical case), the framework assigns it from the code path the value came through, never the producer of the data and never the LLM. Such a fact is never a content judgment and never a producer claim."
