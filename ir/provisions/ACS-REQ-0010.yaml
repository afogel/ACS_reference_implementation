note: "Recursive: trust of an agent_generated object is min over the transitive derived_from closure, which is what ACS-DEF-0002 makes transitive. No schema ref: provenance.json says trust is not a v0.1 schema field and implementations that carry it extend the schema, so there is no pointer to pin (R5.2 has nothing to cite here)."
predicate:
  subject: [Seq, Pid]
  witness: [Ancestor, Path, Level, AncestorLevel]
  rules:
    - "violation(Seq, Pid, Ancestor, Path, Level, AncestorLevel) :- trust(Seq, Pid, Level), provenance(Seq, _, Pid, \"agent_generated\"), ancestor(Pid, Ancestor, Path), trust(_, Ancestor, AncestorLevel), trust_rank(Level, Rank), trust_rank(AncestorLevel, AncestorRank), Rank > AncestorRank."
    - "ancestor(Pid, Parent, Path) :- derived_from(_, Pid, Parent), Path = cat(Pid, \"<-\", Parent)."
    - "ancestor(Pid, Ancestor, Path) :- derived_from(_, Pid, Parent), ancestor(Parent, Ancestor, Rest), Path = cat(Pid, \"<-\", Rest)."
