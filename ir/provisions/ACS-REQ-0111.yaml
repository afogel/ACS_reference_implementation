note: "entries_compacted lists step_ids; the check treats each as the provenance_id the entry contributed, which is how the hook schema describes the union. Extra derived_from entries are not reported."
predicate:
  subject: [Seq]
  witness: [Summary, Detail]
  rules:
    - "violation(Seq, Summary, Detail) :- compaction_summary_provenance(Seq, Summary), provenance(Seq, _, Summary, Origin), Origin != \"agent_generated\", Detail = cat(\"origin=\", Origin)."
    - "violation(Seq, Summary, Detail) :- compaction_summary_provenance(Seq, Summary), compaction_entry(Seq, StepId), not derived_from(Seq, Summary, StepId), Detail = cat(\"missing=\", StepId)."
