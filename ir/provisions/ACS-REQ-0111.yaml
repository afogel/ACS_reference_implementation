id: ACS-REQ-0111
title: "A compaction summary carries the union of its inputs' lineage"
actor: framework
reported_against: framework
profile: [acs-provenance]
activation: null
modality_kind: obligation
evidence_class: wire
schema_refs: []
depends_on: [ACS-DEF-0002]
restates: null
status: active
since: "0.1.0"
superseded_by: []
reviewed_against: d79fbb903a7882d1a5d197e95c1cf0b33e72557e93cec937c7b21b73d0edd237
note: "entries_compacted lists step_ids and nothing on the wire ties a step_id to a provenance_id, so the union check reads step_provenance from the Guardian's records; a Guardian that does not supply it leaves this provision unevaluated (R4.5) rather than approximated. Extra derived_from entries are not reported."
predicate:
  subject: [Seq]
  witness: [Summary, Detail]
  rules:
    - "violation(Seq, Summary, Detail) :- compaction_summary_provenance(Seq, Summary), provenance(Seq, _, Summary, Origin), Origin != \"agent_generated\", Detail = cat(\"origin=\", Origin)."
    - "violation(Seq, Summary, Detail) :- compaction_summary_provenance(Seq, Summary), hook(Seq, Session, _), compaction_entry(Seq, StepId), step_provenance(Session, StepId, Pid), not derived_from(Seq, Summary, Pid), Detail = cat(\"missing=\", Pid)."
