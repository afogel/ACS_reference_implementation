note: "The bound is deployment-defined, so the verifier needs it as an external fact (V5); what the wire shows is the DEFER count per session. \u00a79.2's substituted DEFERs count toward this bound."
predicate:
  subject: [Session]
  witness: [Deferrals, Bound]
  rules:
    - "violation(Session, Deferrals, Bound) :- defer_bound(Session, Bound), Deferrals = count : { defer_in(Session, _) }, Deferrals > Bound."
    - "defer_in(Session, Seq) :- request(Q, Session, _, _, _), response_to(Q, Seq), decision(Seq, \"defer\")."
