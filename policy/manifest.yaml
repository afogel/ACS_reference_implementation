agent_control_specification_version: "0.3.1-beta"
metadata:
  name: "acs-reference-implementation"
policies:
  agt_stock:
    type: rego
    # Relative to this manifest's own directory (policy/), NOT the process
    # cwd — confirmed empirically by tracing the opa subprocess AGT spawns.
    # "policy/lib" here would join to ".../policy/policy/lib" and every
    # evaluation would hard-fail with runtime_error:policy_invocation_failed
    # (opa: no such file or directory) instead of allow/deny. No leading
    # "./" either — see C2: OPA's bundle loader mis-derives the data mount
    # path from a literal "/./ " segment and silently drops data.json.
    bundle: lib
    query: data.agt.defaults.verdict
intervention_points:
  pre_tool_call:
    # R1.6 -- this leaf's argument name ("command") must agree with
    # mapping.yaml's field_synthesis.modifications.policy_target_argument,
    # which is how AGT's transform ($policy_target) lands as ACS
    # parameter_overrides.
    policy_target: "$.tool_call.args.command"
    policy_target_kind: tool_args
    tool_name_from: "$.tool_call.name"
    policy:
      id: agt_stock
  # V4 (slice #5). Additive: nothing evaluates this point until a
  # steps/toolCallResult envelope arrives, and pre_tool_call above is
  # unaffected -- pinned by this task's fourth test.
  #
  # The target indexes into the ACS payload's own `outputs` array, which
  # AGT's JSONPath supports directly (verified). `tool_name_from` is
  # load-bearing here and not decoration: without a `tool_call.name` in the
  # snapshot AGT fails closed with runtime_error:path_missing before any
  # rule runs, so `assembleResultSnapshot` synthesizes it from the payload's
  # `tool.name`.
  #
  # That is N23's result-gate sibling in
  # packages/guardian/src/assemble-snapshot.ts, NOT `assembleSnapshot` beside
  # it: the two are separate functions over separate envelope types, and only
  # the result one can read a `tool.name` out of a result payload. This comment
  # named `assembleSnapshot` while the sibling was still unnamed (V4 Task 1),
  # and a reader following that pointer landed in the pre-tool assembler, where
  # there is no `tool_result` in sight, and could only conclude the synthesis
  # was missing.
  post_tool_call:
    policy_target: "$.tool_result.outputs[0].value"
    policy_target_kind: tool_result
    tool_name_from: "$.tool_call.name"
    policy:
      id: agt_stock
tools:
  run_shell:
    type: Tool
    id: run_shell
    security_labels: [shell]
  # Task 8 addition: an unregistered tool_call.name fails AGT's own
  # evaluation closed with a generic runtime_error:tool_unknown deny --
  # discovered by Task 8's real host -> wire -> policy -> host test, which
  # posts a real Claude Code PreToolUse envelope (tool.name "Bash", per
  # Task 7's own fixture) through a live Guardian. "run_shell" above is
  # AGT's own stock example name and stays for the existing bridge/guardian
  # tests that fixture against it; "Bash" is Claude Code's actual tool name
  # for shell execution and must be registered too for the real demo (Task
  # 9) to evaluate real Claude Code payloads rather than fail closed on an
  # unknown tool before the destructive-command pattern check ever runs.
  Bash:
    type: Tool
    id: Bash
    security_labels: [shell]
